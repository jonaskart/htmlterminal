<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML 5 Boilerplate</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="topfane">
        <div class="textfane">
            <p>jonas@home:~</p>
            <div class="windowbuttons">
                <ul class="windowlist">
                    <li>_</li>
                    <li>□</li>
                    <li>X</li>
                </ul>
            </div>
        </div>
    </div>
    <main>
        <div class="console">
            <ul class="consolelist">
            <p><span style="color:greenyellow">jonas@home</span>:<span style="color:blue">~</span>$</p>
            <p id="hiddencommand">cat cv.txt</p>
            <p id="blinking">█</p>
            </ul>
        </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
